<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://zakblhuidoiarhahzlsu.supabase.co https://api.open-meteo.com https://formspree.io; form-action 'self'; base-uri 'self'; object-src 'none'">
<title>PoleLap · Accedi</title>
<link rel="stylesheet" href="gl.css">
<script src="gl-analytics.js"></script>
</head>
<body>
<div class="wrap narrow">
  <h1>PoleLap <span class="dot">·</span> Accedi</h1>
  <p class="sub">Nessuna password. Ti arriva un link via email, valido una volta sola.</p>

  <div class="card">
    <form id="f">
      <label for="email">Indirizzo email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="tu@esempio.it">
      <button id="go" type="submit">Inviami il link</button>
    </form>
    <div id="msg"></div>
  </div>

  <p class="foot">
    Raccogliamo solo l'email, tramite Supabase Auth · nessun altro dato personale ·
    <a href="privacy.html">privacy</a> · <a href="index.html">torna al sito</a>
  </p>
</div>

<!-- versione FISSATA: "@2" serviva l'ultima 2.x qualunque essa fosse,
     cioe' codice non revisionato su una pagina che tiene la sessione. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"
        integrity="sha384-m/8UHFJHeU6nrCKP2hBnAseuvAKUmLF+8e5bWos5CJL023vuxX7kiVL5t8yjsJhV" crossorigin="anonymous"></script>
<script src="sb.js"></script>
<script>
const say = (t, k = 'info') => $('#msg').innerHTML = `<div class="msg ${k}">${t}</div>`;

// Chi ha gia' una sessione valida non deve rivedere il form.
(async () => {
  if (await sessione()) location.replace('account.html');
})();

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim();
  $('#go').disabled = true;
  say('Invio in corso…');
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: pagina('account.html') }
  });
  if (error) {
    // Rate limit del tier gratuito Supabase: ~30 email/ora. Va detto, non nascosto.
    say(`Non ha funzionato: ${error.message}`, 'err');
    $('#go').disabled = false;
    return;
  }
  say(`Fatto. Controlla <b>${email}</b> e apri il link per entrare.<br>
       Se non arriva entro qualche minuto, guarda nello spam.`, 'ok');
});
</script>
</body>
</html>
